apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-argocd
  namespace: argocd-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-argocd
  template:
    metadata:
      labels:
        app: hello-argocd
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80